name: build

on:
  push:
    paths:
      - sdkexamples/**
    branches:
      - main
  pull_request:
    paths:
      - sdkexamples/**
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Setup Go sdkexamples/go.mod file
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@7.0.0
        with:
          go-version-file: 'sdkexamples/go.mod'
          check-latest: true
      - name: Build sdkexamples
        run: make sdkexamples
